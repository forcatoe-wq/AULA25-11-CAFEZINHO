<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cafézin</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <header class="topo">
    <h1>Cafeteria do Bairro</h1>
    <nav >
      <ul class="menu">

        <li><a href="index.html" >Início</a></li>
        <li><a href="#cardapio">Cardápio</a></li>
        <li><a href="#contato">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h2 id="cardapio">Destaques de Hoje</h2>

   
    <div class="vitrine">

      <article class="cartao">
        <img 
          src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=400" 
          alt="Xícara de café expresso cremoso sobre mesa de madeira" 
          class="foto-produto"
        >
        <h3>Café Expresso</h3>
        <p>Grãos selecionados e torrados na hora.</p>
        
        <a href="#contato" class="botao" >
          <span>☕</span> Fazer Pedido
        </a>
      </article>

      <article class="cartao">
        <img 
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRZs_FxYAsWZg5dcnyvdhqfPVwsAlD_gJeRuD7MGD558A&s=10" 
          alt="Porção de pães de queijo dourados e quentinhos em uma cesta" 
          class="foto-produto"
        >
        <h3>Pão de Queijo</h3>
        <p>Receita mineira tradicional, crocante por fora.</p>
        <a href="#contato" class="botao" >
          <span>🧀</span> Fazer Pedido
        </a>
      </article>

    </div>
  </main>

  <footer id="contato">
    <p>Cafézin - 2026</p>
  </footer>

</body>
</html>
